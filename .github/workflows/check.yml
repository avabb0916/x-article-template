name: content-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check all posts
        run: |
          shopt -s nullglob
          files=(posts/*.md)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no posts yet"; exit 0
          fi
          node scripts/check.mjs "${files[@]}"
